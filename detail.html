<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
        <link rel="stylesheet" href="style.css">
        <script src="detail.js" defer></script>
        <script src="dark-mode.js" defer></script>
        <title>MyMovies</title>
    </head>
    <body>
        <div id="body-wrapper">
            <header>
                <div id="ios-top-bar"></div>
                <div id="title-box">
                    <svg></svg>
                    <h1>MyMovies</h1>
                    <label class="light-switch">
                        <input type="checkbox" class="switch-toggle">
                        <div class="switch-base"></div>
                    </label>
                </div>
            </header>
            <main>
                <section id="now-showing">
                    <header>
                        <h2 id="now-showing-title">Now Showing</h2>
                        <button id="now-showing-button">See more</button>
                    </header>
                    <ul id="now-showing-movie-box"></ul>
                </section>
                <section id="popular">
                    <header>
                        <h2>Popular</h2>
                        <button>See more</button>
                    </header>
                    <ul id="popular-movie-box"></ul>
                </section>
            </main>
            <footer>
                <div id="bottom-navigation">
                    <svg></svg>
                    <svg></svg>
                    <svg></svg>
                </div>
                <figure id="ios-home-bar"></figure>
            </footer>
        </div>
    </body>
</html>
