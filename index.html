<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap">
        <link rel="stylesheet" href="style.css">
        <script src="my-movies.js" defer></script>
        <script src="dark-mode.js" defer></script>
        <title>MyMovies</title>
    </head>
    <body>
        <div id="body-wrapper">
            <header>
                <div id="ios-top-bar"></div>
                <div id="title-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 14" fill="none">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M7 0.75C7 0.335786 7.33579 0 7.75 0H15.25C15.6642 0 16 0.335786 16 0.75C16 1.16421 15.6642 1.5 15.25 1.5H7.75C7.33579 1.5 7 1.16421 7 0.75ZM0 6.75C0 6.33579 0.335786 6 0.75 6H15.25C15.6642 6 16 6.33579 16 6.75C16 7.16421 15.6642 7.5 15.25 7.5H0.75C0.335786 7.5 0 7.16421 0 6.75ZM0.75 12C0.335786 12 0 12.3358 0 12.75C0 13.1642 0.335786 13.5 0.75 13.5H8.25C8.66421 13.5 9 13.1642 9 12.75C9 12.3358 8.66421 12 8.25 12H0.75Z" fill="#FFF"/>
                    </svg>
                    <h1>MyMovies</h1>
                    <label class="light-switch">
                        <input type="checkbox" class="switch-toggle">
                        <div class="switch-base"></div>
                    </label>
                </div>
            </header>
            <main>
                <section id="now-showing">
                    <header>
                        <h2 id="now-showing-title">Now Showing</h2>
                        <button class="dark-mode">See more</button>
                    </header>
                    <ul id="now-showing-movie-box"></ul>
                </section>
                <section id="popular">
                    <header>
                        <h2>Popular</h2>
                        <button class="light-mode">See more</button>
                    </header>
                    <ul id="popular-movie-box"></ul>
                </section>
            </main>
            <footer>
                <div id="bottom-navigation">
                    <svg></svg>
                    <svg></svg>
                    <svg></svg>
                </div>
                <figure id="ios-home-bar"></figure>
            </footer>
        </div>
    </body>
</html>
